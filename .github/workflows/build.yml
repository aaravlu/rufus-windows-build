name: Build Rufus

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Rufus
        uses: actions/checkout@v4
        with:
          repository: pbatard/rufus
          ref: refs/tags/v3.15
          path: rufus

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Build
        working-directory: rufus
        run: msbuild rufus.sln /p:Platform=x64 /p:Configuration=Release /p:WholeProgramOptimization=true /p:ClCompileAdditionalOptions="/EH-"
      - name: Archive Binary
        uses: actions/upload-artifact@v4
        with:
          name: rufus
          path: |
            rufus/x64/Debug/rufus.exe
            rufus/x64/Release/rufus.exe
